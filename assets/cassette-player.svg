      <path d="M770 126h106v204l-44 40H655Z" fill="#a6d8d1" opacity=".025"/>
      <path d="M372 338C449 305 514 296 600 296s151 9 228 42" fill="none" stroke="#050606" stroke-width="42" opacity=".62"/>
      <path class="tape-flow" d="M399 292C470 315 531 323 600 323s130-8 201-31" fill="none" stroke="#6d4f31" stroke-width="5" stroke-linecap="round" stroke-dasharray="24 20"/>

      <g>
        <path d="M388 177Q388 155 410 155H790Q812 155 812 177V318Q812 340 790 340H410Q388 340 388 318Z" fill="url(#cassette)" stroke="#ebe4d3" stroke-opacity=".45"/>
        <path d="M421 188H779L760 278H440Z" fill="#2c2d2a" stroke="#777367"/>
        <rect x="456" y="209" width="288" height="75" rx="36" fill="#171817" stroke="#77766e" stroke-width="2"/>
        <path d="M447 306H753L729 336H471Z" fill="#777064" stroke="#d0c8b5" stroke-opacity=".45"/>
        <g fill="#4f4c45" stroke="#e2dac8" stroke-opacity=".48">
          <circle cx="413" cy="180" r="5"/><circle cx="787" cy="180" r="5"/>
          <circle cx="413" cy="316" r="5"/><circle cx="787" cy="316" r="5"/>
        </g>
        <path d="M511 325h178" stroke="#262623" stroke-width="3" opacity=".7"/>
      </g>

      <g class="reel-left">
        <circle cx="492" cy="247" r="48" fill="#d8d0bd" stroke="#242523" stroke-width="5"/>
        <circle cx="492" cy="247" r="33" fill="#1a1b1a"/>
        <g fill="#c8c0ae">
          <path d="M487 216h10l4 19-9 5-9-5Z"/><path d="M487 278h10l4-19-9-5-9 5Z"/>
          <path d="M461 242v10l19 4 5-9-5-9Z"/><path d="M523 242v10l-19 4-5-9 5-9Z"/>
          <path d="M469 224l7-7 16 10-3 10-10 3Z"/><path d="M515 270l7-7-10-16-10 3-3 10Z"/>
          <path d="M515 224l-7-7-16 10 3 10 10 3Z"/><path d="M469 270l-7-7 10-16 10 3 3 10Z"/>
        </g>
        <circle cx="492" cy="247" r="10" fill="#222321" stroke="#d8d0bd"/>
      </g>

      <g class="reel-right">
        <circle cx="708" cy="247" r="48" fill="#d8d0bd" stroke="#242523" stroke-width="5"/>
        <circle cx="708" cy="247" r="33" fill="#1a1b1a"/>
        <g fill="#c8c0ae">
          <path d="M703 216h10l4 19-9 5-9-5Z"/><path d="M703 278h10l4-19-9-5-9 5Z"/>
          <path d="M677 242v10l19 4 5-9-5-9Z"/><path d="M739 242v10l-19 4-5-9 5-9Z"/>
          <path d="M685 224l7-7 16 10-3 10-10 3Z"/><path d="M731 270l7-7-10-16-10 3-3 10Z"/>
          <path d="M731 224l-7-7-16 10 3 10 10 3Z"/><path d="M685 270l-7-7 10-16 10 3 3 10Z"/>
        </g>
        <circle cx="708" cy="247" r="10" fill="#222321" stroke="#d8d0bd"/>
      </g>
    </g>

    <path d="M326 126h548" stroke="#ced2ce" stroke-opacity=".12"/>
    <path d="M337 359h526" stroke="#000" stroke-opacity=".48"/>

    <g>
