      <rect x="656" y="410" width="56" height="18" rx="4" fill="#090a0b" stroke="#3d413f"/>
      <rect x="722" y="410" width="56" height="18" rx="4" fill="#090a0b" stroke="#3d413f"/>
      <rect x="788" y="410" width="56" height="18" rx="4" fill="#090a0b" stroke="#3d413f"/>
