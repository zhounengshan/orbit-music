      <rect x="422" y="410" width="56" height="18" rx="4" fill="#090a0b" stroke="#3d413f"/>
      <rect x="488" y="410" width="56" height="18" rx="4" fill="#090a0b" stroke="#3d413f"/>
      <g transform="translate(0 2)">
        <rect x="554" y="408" width="92" height="20" rx="5" fill="#c5c7c1" stroke="#f0f0e9" stroke-opacity=".45"/>
        <path d="M592 413l14 7-14 7Z" fill="#171918"/>
