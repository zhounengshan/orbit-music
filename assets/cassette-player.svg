<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">复古磁带播放机矢量动效图稿</title>
  <desc id="desc">深色金属卡座内装有一盒暖灰磁带，双卷带轮持续转动，两只电平表指针随节奏摆动。</desc>
  <defs>
    <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b0c"/>
      <stop offset=".52" stop-color="#121514"/>
      <stop offset="1" stop-color="#07090a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d2d"/>
      <stop offset=".48" stop-color="#181b1c"/>
      <stop offset="1" stop-color="#101213"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b4d4b"/>
      <stop offset=".28" stop-color="#202323"/>
      <stop offset=".72" stop-color="#2b2e2d"/>
      <stop offset="1" stop-color="#555754"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2223"/>
      <stop offset=".48" stop-color="#070b0d"/>
      <stop offset="1" stop-color="#14191a"/>
    </linearGradient>
    <linearGradient id="cassette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d0bc"/>
      <stop offset="1" stop-color="#9e9788"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ead9ab"/>
      <stop offset="1" stop-color="#b59f72"/>
    </linearGradient>
    <radialGradient id="lamp">
      <stop offset="0" stop-color="#d7fff8"/>
      <stop offset=".28" stop-color="#68e5d7"/>
      <stop offset="1" stop-color="#173c39"/>
    </radialGradient>
    <filter id="deviceShadow" x="-20%" y="-25%" width="140%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity=".62"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="doorClip"><rect x="326" y="126" width="548" height="244" rx="15"/></clipPath>
  </defs>
  <style>
    .reel-left{transform-origin:492px 247px;animation:reel 2.1s linear infinite}
    .reel-right{transform-origin:708px 247px;animation:reel 1.72s linear infinite}
    .tape-flow{animation:tape 1.1s linear infinite}
    .needle-left{transform-origin:212px 207px;animation:needleLeft .72s ease-in-out infinite alternate}
    .needle-right{transform-origin:988px 207px;animation:needleRight .56s ease-in-out infinite alternate}
    .pilot-glow{animation:glow 1.35s ease-in-out infinite alternate}
    .reel-left,.reel-right,.tape-flow,.needle-left,.needle-right,.pilot-glow{animation-play-state:paused}
    .is-playing .reel-left,.is-playing .reel-right,.is-playing .tape-flow,.is-playing .needle-left,.is-playing .needle-right,.is-playing .pilot-glow{animation-play-state:running}
    @keyframes reel{to{transform:rotate(360deg)}}
    @keyframes tape{to{stroke-dashoffset:-44}}
    @keyframes needleLeft{0%{transform:rotate(-14deg)}35%{transform:rotate(7deg)}70%{transform:rotate(-4deg)}100%{transform:rotate(16deg)}}
    @keyframes needleRight{0%{transform:rotate(-10deg)}32%{transform:rotate(15deg)}68%{transform:rotate(2deg)}100%{transform:rotate(20deg)}}
    @keyframes glow{to{opacity:.38}}
    @media (prefers-reduced-motion:reduce){.reel-left,.reel-right,.tape-flow,.needle-left,.needle-right,.pilot-glow{animation:none}}
  </style>
  <rect width="1200" height="520" fill="url(#scene)"/>
  <ellipse cx="600" cy="453" rx="492" ry="32" fill="#000" opacity=".48"/>
  <g filter="url(#deviceShadow)">
    <rect x="78" y="42" width="1044" height="406" rx="28" fill="url(#edge)"/>
    <rect x="88" y="52" width="1024" height="386" rx="21" fill="url(#face)" stroke="#666965" stroke-opacity=".34"/>
    <path d="M106 73H1094" stroke="#858a86" stroke-opacity=".22"/>
    <path d="M106 418H1094" stroke="#000" stroke-opacity=".68"/>

    <g opacity=".76">
