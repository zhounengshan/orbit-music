      <circle cx="212" cy="207" r="6" fill="#24221e"/>
    </g>

    <g>
      <rect x="910" y="112" width="156" height="126" rx="9" fill="#0c0e0e" stroke="#4a4d4a"/>
      <rect x="923" y="127" width="130" height="88" rx="5" fill="url(#meter)"/>
      <path d="M936 194Q988 150 1040 194" fill="none" stroke="#2e2c27" stroke-width="2"/>
      <g stroke="#4a4438" stroke-width="1.4">
        <path d="M945 189l-4-8M960 177l-5-8M977 169l-2-9M996 167v-9M1015 171l3-9M1031 180l5-8"/>
      </g>
