    <rect x="314" y="112" width="572" height="270" rx="17" fill="#15191a" stroke="#050607" stroke-width="5"/>
    <rect x="326" y="126" width="548" height="244" rx="15" fill="url(#glass)"/>
    <g clip-path="url(#doorClip)">
